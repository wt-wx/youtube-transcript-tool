groups:
  internal_hub:
    desc: "Management Bastion Host"
    user: [USER]
    port: [PORT]
    hosts:
      - [LOCAL_IP]

  external_nodes:
    desc: "Distributed Worker Nodes"
    key_filename: [PATH_TO_PRIVATE_KEY]
    hosts:
      # Node 1: Capture Node
      - host: [NODE_1_IP_OR_DOMAIN]
        user: [USER]
        port: [PORT]

      # Node 2: ASR Node
      - host: [NODE_2_IP_OR_DOMAIN]
        user: [USER]
        port: [PORT]
